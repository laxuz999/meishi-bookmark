<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUA名刺ポケット</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: linear-gradient(160deg, #fff7ed 0%, #fef3f2 35%, #eff6ff 70%, #f0fdfa 100%);
    }

    /* 一覧カード（動的生成のため <script type="module"> は変更せず、
       #cards 配下の構造に対して<head>側のCSSでNEXUAトーンを適用する） */
    #cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    #cards > div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #ffffff;
      border-radius: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      padding: 1rem;
      margin-bottom: 0;
    }
    #cards > div > a,
    #cards > div > span:first-child {
      font-weight: 700;
      color: #262626;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    #cards > div > a:hover {
      color: #fb7185;
      text-decoration: underline;
    }
    #cards > div > span:last-of-type {
      font-size: 0.7rem;
      color: #a3a3a3;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #cards > div > button {
      font-size: 0.7rem;
      font-weight: 700;
      color: #f43f5e;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 9999px;
      padding: 0.35rem 0.75rem;
      flex-shrink: 0;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    #cards > div > button:hover {
      background: #ffe4e6;
    }
  </style>
</head>
<body class="min-h-screen text-neutral-800">
  <div id="app" class="max-w-md mx-auto px-6 py-12">
    <p id="status" class="text-sm text-neutral-500 text-center mb-4">読み込み中...</p>
    <div id="home-screen-notice" style="display:none" class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-2xl text-xs text-amber-800 leading-relaxed">
      <strong>📱 iPhoneでホーム画面に追加する場合</strong><br><br>
      ①画面下部（または上部）の<strong>共有ボタン</strong>（四角に↑のアイコン）をタップ<br>
      ②「<strong>ホーム画面に追加</strong>」を選択<br>
      ③追加ダイアログの「<strong>Webアプリとして開く</strong>」は<strong>オフ</strong>にする<br>
      ④「追加」をタップ<br><br>
      オンのままだと、保存した内容が後で見えなくなることがあります。
    </div>
    <a id="list-link" href="./" style="display:none" class="block w-full mb-6 px-6 py-3 bg-gradient-to-r from-rose-400 to-orange-400 text-white rounded-2xl font-bold shadow-lg hover:from-rose-500 hover:to-orange-500 active:scale-95 transition-all text-center text-sm">保存した名刺の一覧を見る</a>
    <div id="list-ui" style="display:none">
      <button id="backup-btn" class="w-full mb-4 px-6 py-3 bg-gradient-to-r from-rose-400 to-orange-400 text-white rounded-2xl font-bold shadow-lg hover:from-rose-500 hover:to-orange-500 active:scale-95 transition-all text-sm">Googleでバックアップ・他の端末と同期する</button>
      <div class="flex flex-col sm:flex-row gap-2 mb-4">
        <input id="search" type="text" placeholder="名前で検索" class="flex-1 px-4 py-2.5 bg-white/80 backdrop-blur border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100 transition-all" />
        <select id="sort" class="px-4 py-2.5 bg-white/80 backdrop-blur border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 transition-all">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
        </select>
      </div>
      <div id="cards"></div>
      <p class="text-[10px] text-neutral-400 text-center mt-6 leading-relaxed">iPhoneでホーム画面に追加する場合は、共有ボタンから「ホーム画面に追加」を選び、追加ダイアログの「Webアプリとして開く」をオフにしてください。オンのままだと保存した内容が見えなくなることがあります。</p>
    </div>
  </div>
  <script type="module">
    import { parseBookmarkParams } from './src/logic.js';
    import { initGoogleAuth, requestLogin } from './src/auth.js';
    import { findSheet, createSheet, appendBookmark, listBookmarks, deleteBookmark } from './src/sheets.js';
    import { filterAndSort } from './src/render.js';
    import { saveLocal, listLocal, deleteLocal } from './src/storage.js';

    const GOOGLE_CLIENT_ID = '36570369679-h9sfr7dh7i1suota1j6eko79el7gsu30.apps.googleusercontent.com';
    const GOOGLE_LINKED_KEY = 'meishi_google_linked';
    const bookmark = parseBookmarkParams(new URLSearchParams(location.search));
    const statusEl = document.getElementById('status');
    const homeScreenNoticeEl = document.getElementById('home-screen-notice');
    const listLinkEl = document.getElementById('list-link');
    const backupBtn = document.getElementById('backup-btn');
    const listUi = document.getElementById('list-ui');
    const cardsEl = document.getElementById('cards');
    const searchEl = document.getElementById('search');
    const sortEl = document.getElementById('sort');

    let currentSheet = null;
    let allBookmarks = [];
    // 一覧の表示元。'local' = このブラウザのlocalStorage、'google' = Googleスプレッドシート
    let syncMode = 'local';

    function isGoogleLinked() {
      return localStorage.getItem(GOOGLE_LINKED_KEY) === '1';
    }

    function resetBackupBtn() {
      backupBtn.disabled = false;
      backupBtn.textContent = isGoogleLinked()
        ? 'タップしてGoogle側の一覧を表示'
        : 'Googleでバックアップ・他の端末と同期する';
    }

    // 保存モード: 認証不要で即座にこの端末内へ保存して終わり（1タップで完結）
    function saveFlow() {
      saveLocal(bookmark);
      statusEl.textContent = `「${bookmark.name || '名前未設定の名刺'}」を保存しました。`;
      homeScreenNoticeEl.style.display = 'block';
      listLinkEl.style.display = 'block';
    }

    // 「Googleでバックアップ・同期する」を押した人だけがここに来る
    async function backupFlow(token) {
      window.__accessToken = token;
      backupBtn.disabled = true;
      backupBtn.textContent = '連携しています...';
      try {
        let sheet = await findSheet(token);
        if (!sheet) sheet = await createSheet(token);
        currentSheet = sheet;

        if (!isGoogleLinked()) {
          // 初回連携: それまでこの端末に貯まっていたローカルデータをまとめてアップロード
          for (const b of listLocal()) {
            await appendBookmark(token, sheet.spreadsheetId, b);
          }
          localStorage.setItem(GOOGLE_LINKED_KEY, '1');
        }

        allBookmarks = await listBookmarks(token, sheet.spreadsheetId);
        syncMode = 'google';
        backupBtn.textContent = 'Googleと同期済みです';
        renderCards();
      } catch (err) {
        resetBackupBtn();
        alert('Google連携に失敗しました。もう一度お試しください。');
      }
    }

    function isSafeHttpUrl(url) {
      try {
        const parsed = new URL(url, location.href);
        return parsed.protocol === 'http:' || parsed.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function renderCards() {
      const filtered = filterAndSort(allBookmarks, searchEl.value, sortEl.value);
      cardsEl.innerHTML = '';
      for (const b of filtered) {
        const card = document.createElement('div');

        const linkText = b.name || '（名前未設定の名刺）';
        if (isSafeHttpUrl(b.url)) {
          const link = document.createElement('a');
          link.href = b.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = linkText;
          card.appendChild(link);
        } else {
          const linkFallback = document.createElement('span');
          linkFallback.textContent = linkText;
          card.appendChild(linkFallback);
        }

        const tagsSpan = document.createElement('span');
        tagsSpan.textContent = b.tags.join('・');
        card.appendChild(tagsSpan);

        const dateSpan = document.createElement('span');
        dateSpan.textContent = b.savedAt ? new Date(b.savedAt).toLocaleDateString('ja-JP') : '';
        card.appendChild(dateSpan);

        const button = document.createElement('button');
        button.textContent = '削除';
        button.addEventListener('click', async () => {
          try {
            if (syncMode === 'google') {
              await deleteBookmark(window.__accessToken, currentSheet.spreadsheetId, currentSheet.gid, b.rowIndex);
              allBookmarks = allBookmarks
                .filter(x => x.rowIndex !== b.rowIndex)
                .map(x => x.rowIndex > b.rowIndex ? { ...x, rowIndex: x.rowIndex - 1 } : x);
            } else {
              deleteLocal(b.id);
              allBookmarks = allBookmarks.filter(x => x.id !== b.id);
            }
            renderCards();
          } catch (err) {
            alert('削除できませんでした。もう一度お試しください。');
          }
        });
        card.appendChild(button);

        cardsEl.appendChild(card);
      }
    }

    // 一覧モード: まずこの端末のローカルデータを表示するだけ（ログイン不要）
    function listFlow() {
      allBookmarks = listLocal();
      syncMode = 'local';
      statusEl.style.display = 'none';
      listUi.style.display = 'block';
      renderCards();

      initGoogleAuth(GOOGLE_CLIENT_ID, backupFlow, resetBackupBtn);
      resetBackupBtn();
    }

    window.addEventListener('load', () => {
      if (bookmark) {
        saveFlow();
      } else {
        listFlow();
      }
    });
    backupBtn.addEventListener('click', () => {
      backupBtn.disabled = true;
      backupBtn.textContent = '連携しています...';
      requestLogin();
    });
    searchEl.addEventListener('input', renderCards);
    sortEl.addEventListener('change', renderCards);
  </script>
</body>
</html>
