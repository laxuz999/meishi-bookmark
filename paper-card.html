<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S-NEXUA 撮影名刺</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: linear-gradient(160deg, #eff6ff 0%, #e0f2fe 35%, #dbeafe 70%, #eef2ff 100%);
    }
    #paper-cards > div {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #ffffff;
      border-radius: 1rem;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      padding: 1rem;
    }
    #paper-cards .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: 0.5rem;
      gap: 0.75rem;
      width: 100%;
    }
    #paper-cards .row > span:first-child {
      font-weight: 700;
      color: #262626;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    #paper-cards .row > span:last-of-type {
      font-size: 0.7rem;
      color: #a3a3a3;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #paper-cards .row > button {
      font-size: 0.7rem;
      font-weight: 700;
      color: #f43f5e;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 9999px;
      padding: 0.35rem 0.75rem;
      flex-shrink: 0;
      cursor: pointer;
    }
    #paper-cards .row > button:hover {
      background: #ffe4e6;
    }
    #paper-cards .memo-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
    }
    #paper-cards .memo-text {
      font-size: 0.7rem;
      color: #a3a3a3;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
      min-width: 0;
    }
    #paper-cards .memo-text.placeholder {
      color: #d4d4d4;
      font-style: italic;
    }
    #paper-cards .memo-edit-btn {
      font-size: 0.65rem;
      color: #a3a3a3;
      background: none;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      text-decoration: underline;
    }
    #paper-cards .memo-edit-btn:hover {
      color: #fb7185;
    }
    #paper-cards .memo-edit-area {
      width: 100%;
    }
    #paper-cards .memo-edit-area textarea,
    #paper-cards .memo-edit-area input {
      width: 100%;
      font-size: 0.75rem;
      padding: 0.5rem;
      border: 1px solid #fecdd3;
      border-radius: 0.5rem;
      resize: none;
      font-family: inherit;
    }
    #paper-cards .memo-edit-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }
    #paper-cards .memo-edit-actions button {
      font-size: 0.65rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      cursor: pointer;
      border: none;
    }
    #paper-cards .memo-save-btn {
      background: #fb7185;
      color: white;
    }
    #paper-cards .memo-cancel-btn {
      background: none;
      border: 1px solid #e5e5e5 !important;
      color: #a3a3a3;
    }
    #paper-cards .card-photos-row {
      display: flex;
      gap: 0.5rem;
    }
    #paper-cards .card-photo-link {
      display: block;
      flex: 1;
      min-width: 0;
    }
    #paper-cards .card-photo-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 0.5rem;
      display: block;
    }
  </style>
</head>
<body class="min-h-screen text-neutral-800">
  <div class="max-w-md mx-auto px-6 py-12">
    <h1 class="text-lg font-bold text-center text-neutral-800 mb-1 tracking-tight">📇 S-NEXUA 撮影名刺</h1>
    <p class="text-center mb-6"><a href="./" class="text-[11px] text-neutral-400 hover:text-rose-500 underline underline-offset-2">一覧にもどる</a></p>

    <!-- 合言葉が未設定の場合の案内 -->
    <div id="no-code-notice" style="display:none" class="bg-white/70 backdrop-blur border border-neutral-200 rounded-2xl p-4 text-sm leading-relaxed text-center">
      S-NEXUA 撮影名刺の管理には、まず一覧画面で合言葉を発行・入力してください。<br><br>
      <a href="./" class="inline-block px-6 py-2.5 bg-gradient-to-r from-rose-400 to-orange-400 text-white rounded-2xl font-bold text-sm shadow-md hover:from-rose-500 hover:to-orange-500">一覧画面へ</a>
    </div>

    <!-- 紙の名刺一覧（Google連携不要。合言葉のバックエンドから取得するだけ） -->
    <div id="paper-list-ui" style="display:none">
      <button id="paper-card-open-btn" class="w-full mb-4 px-6 py-3 bg-gradient-to-r from-rose-400 to-orange-400 text-white rounded-2xl font-bold shadow-lg hover:from-rose-500 hover:to-orange-500 active:scale-95 transition-all text-sm">＋ 新しく登録する</button>
      <div class="flex flex-col sm:flex-row gap-2 mb-4">
        <input id="paper-search" type="text" placeholder="名前・タグ・メモで検索" class="flex-1 px-4 py-2.5 bg-white/80 backdrop-blur border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100 transition-all" />
        <select id="paper-sort" class="px-4 py-2.5 bg-white/80 backdrop-blur border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 transition-all">
          <option value="newest">新しい順</option>
          <option value="oldest">古い順</option>
        </select>
      </div>
      <p id="paper-list-status" class="text-sm text-neutral-500 text-center mb-4">読み込み中...</p>
      <div id="paper-cards" class="flex flex-col gap-3"></div>
    </div>

    <!-- 紙の名刺を撮影して登録するモーダル -->
    <div id="paper-card-modal" style="display:none" class="fixed inset-0 z-[60] flex items-center justify-center p-6 bg-black/40 overflow-y-auto">
      <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-sm text-neutral-700 my-8">
        <h3 class="font-bold text-base mb-4">📇 S-NEXUA 撮影名刺を登録</h3>

        <!-- Google連携の案内（写真の保存先はあなた自身のGoogle Drive） -->
        <div id="google-link-notice">
          <p class="leading-relaxed bg-neutral-50 border border-neutral-200 rounded-xl p-3 mb-4 text-xs">
            写真はあなた自身のGoogle Driveに保存されます（NEXUAの運営は保存しません）。続けるにはGoogleと連携してください。
          </p>
          <button id="google-link-btn" class="w-full mb-3 py-2.5 rounded-xl bg-gradient-to-r from-rose-400 to-orange-400 text-white font-bold text-sm shadow-md hover:from-rose-500 hover:to-orange-500">Googleと連携する</button>
          <button id="paper-card-cancel-before-link" class="w-full py-2 text-neutral-400 text-xs">やめる</button>
        </div>

        <!-- 登録フォーム（Google連携後に表示） -->
        <div id="paper-card-form" style="display:none">
          <label class="block text-xs text-neutral-500 mb-1.5">名前</label>
          <input id="paper-card-name" type="text" placeholder="例：山田太郎" class="w-full mb-4 px-4 py-2.5 bg-white/80 border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100 transition-all" />

          <label class="block text-xs text-neutral-500 mb-1.5">タグ（カンマ区切り・任意）</label>
          <input id="paper-card-tags" type="text" placeholder="例：DIY,交流会" class="w-full mb-4 px-4 py-2.5 bg-white/80 border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100 transition-all" />

          <label class="block text-xs text-neutral-500 mb-1.5">メモ（任意）</label>
          <textarea id="paper-card-memo" rows="2" placeholder="例：〇〇交流会で名刺交換" class="w-full mb-4 px-4 py-2.5 bg-white/80 border border-neutral-200 rounded-xl text-sm focus:outline-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100 transition-all resize-none"></textarea>

          <p class="text-xs text-neutral-400 mb-2">スマホを横向きで撮影すると綺麗に収まります</p>
          <input id="paper-card-front-input" type="file" accept="image/*" capture="environment" style="display:none" />
          <button id="paper-card-front-btn" type="button" class="w-full mb-4 px-4 py-2.5 bg-white border border-neutral-200 rounded-xl text-xs font-semibold text-neutral-600 hover:border-rose-400 hover:text-rose-500 transition-colors">📷 表面を撮影・選択（必須）</button>
          <img id="paper-card-front-preview" style="display:none" class="w-full aspect-[16/10] object-cover rounded-xl mb-4" />

          <input id="paper-card-back-input" type="file" accept="image/*" capture="environment" style="display:none" />
          <button id="paper-card-back-btn" type="button" class="w-full mb-4 px-4 py-2.5 bg-white border border-neutral-200 rounded-xl text-xs font-semibold text-neutral-600 hover:border-rose-400 hover:text-rose-500 transition-colors">📷 裏面を撮影・選択（任意）</button>
          <img id="paper-card-back-preview" style="display:none" class="w-full aspect-[16/10] object-cover rounded-xl mb-4" />

          <div class="flex gap-3">
            <button id="paper-card-cancel" class="flex-1 py-2.5 rounded-xl border border-neutral-200 text-neutral-500 font-semibold text-sm hover:bg-neutral-50">やめる</button>
            <button id="paper-card-save" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-400 to-orange-400 text-white font-bold text-sm shadow-md hover:from-rose-500 hover:to-orange-500">登録する</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- alert()/confirm()の代替（URLが出ないよう自前モーダルで表示） -->
  <div id="app-dialog-modal" style="display:none" class="fixed inset-0 z-[70] flex items-center justify-center p-6 bg-black/40">
    <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full p-6 text-sm text-neutral-700">
      <p class="text-[10px] font-bold text-rose-500 mb-2 tracking-wide">NEXUA名刺ポケット</p>
      <p id="app-dialog-message" class="mb-5 leading-relaxed"></p>
      <div class="flex gap-3">
        <button id="app-dialog-cancel" style="display:none" class="flex-1 py-2.5 rounded-xl border border-neutral-200 text-neutral-500 font-semibold text-sm hover:bg-neutral-50">キャンセル</button>
        <button id="app-dialog-ok" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-rose-400 to-orange-400 text-white font-bold text-sm shadow-md hover:from-rose-500 hover:to-orange-500">OK</button>
      </div>
    </div>
  </div>

  <!-- 名刺写真の拡大表示（背景クリックまたは閉じるボタンで閉じる） -->
  <div id="lightbox-modal" style="display:none" class="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/80">
    <button id="lightbox-close" class="absolute top-4 right-4 text-white text-3xl leading-none w-10 h-10 flex items-center justify-center" aria-label="閉じる">&times;</button>
    <img id="lightbox-img" class="max-w-full max-h-full object-contain rounded-lg" alt="" />
  </div>

  <script type="module">
    import { initGoogleAuth, requestLogin } from './src/auth.js?v=20260823b';
    import { uploadPhoto } from './src/drive.js?v=20260823b';
    import { getBookmarks, saveBookmarks, isPaperCard, describeApiError } from './src/pocketApi.js?v=20260823d';
    import { createAppDialog } from './src/dialog.js?v=20260823c';
    import { renderEditableRow } from './src/inlineEditor.js?v=20260823c';
    import { filterAndSort } from './src/render.js?v=20260823c';

    const GOOGLE_CLIENT_ID = '36570369679-h9sfr7dh7i1suota1j6eko79el7gsu30.apps.googleusercontent.com';
    const POCKET_CODE_KEY = 'meishi_pocket_code';

    const noCodeNotice = document.getElementById('no-code-notice');
    const paperListUi = document.getElementById('paper-list-ui');
    const paperListStatus = document.getElementById('paper-list-status');
    const paperCardsEl = document.getElementById('paper-cards');
    const paperCardOpenBtn = document.getElementById('paper-card-open-btn');
    const paperSearchEl = document.getElementById('paper-search');
    const paperSortEl = document.getElementById('paper-sort');
    const paperCardModal = document.getElementById('paper-card-modal');
    const googleLinkNotice = document.getElementById('google-link-notice');
    const googleLinkBtn = document.getElementById('google-link-btn');
    const paperCardCancelBeforeLink = document.getElementById('paper-card-cancel-before-link');
    const paperCardForm = document.getElementById('paper-card-form');
    const paperCardNameInput = document.getElementById('paper-card-name');
    const paperCardTagsInput = document.getElementById('paper-card-tags');
    const paperCardMemoInput = document.getElementById('paper-card-memo');
    const paperCardFrontInput = document.getElementById('paper-card-front-input');
    const paperCardFrontBtn = document.getElementById('paper-card-front-btn');
    const paperCardFrontPreview = document.getElementById('paper-card-front-preview');
    const paperCardBackInput = document.getElementById('paper-card-back-input');
    const paperCardBackBtn = document.getElementById('paper-card-back-btn');
    const paperCardBackPreview = document.getElementById('paper-card-back-preview');
    const paperCardCancelBtn = document.getElementById('paper-card-cancel');
    const paperCardSaveBtn = document.getElementById('paper-card-save');
    const { appAlert, appConfirm } = createAppDialog();
    const lightboxModal = document.getElementById('lightbox-modal');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(url, alt) {
      lightboxImg.src = url;
      lightboxImg.alt = alt;
      lightboxModal.style.display = 'flex';
    }
    function closeLightbox() {
      lightboxModal.style.display = 'none';
      lightboxImg.removeAttribute('src');
    }
    lightboxClose.addEventListener('click', closeLightbox);
    // 背景（画像自体は除く）をクリックしたら閉じる
    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) closeLightbox();
    });

    function resizeImageFile(file, maxDim = 1600, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round(height * (maxDim / width));
                width = maxDim;
              } else {
                width = Math.round(width * (maxDim / height));
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              if (blob) resolve(blob); else reject(new Error('画像の変換に失敗しました'));
            }, 'image/jpeg', quality);
          };
          img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('ファイルの読み込みに失敗しました'));
        reader.readAsDataURL(file);
      });
    }

    let allBookmarks = [];
    let paperCardFrontBlob = null;
    let paperCardBackBlob = null;

    function getCode() {
      return localStorage.getItem(POCKET_CODE_KEY);
    }

    function paperCardsOnly(list) {
      return list.filter(isPaperCard);
    }

    // 削除・タグ編集・メモ編集の直前にサーバーの最新一覧を取り直してから
    // mutateを適用して保存する。ページを開いた時点のallBookmarksをそのまま
    // 使って上書き保存すると、その後に他端末/他タブで追加・変更された分が
    // 巻き戻ってしまうため（新規登録の保存処理と同じ考え方）
    async function saveWithRefetch(code, mutate) {
      const remote = await getBookmarks(code);
      if (!remote.success) throw new Error(describeApiError(remote, '最新の一覧の取得に失敗しました'));
      const updated = mutate(remote.bookmarks);
      const res = await saveBookmarks(code, updated);
      if (!res.success) throw new Error(describeApiError(res, '保存に失敗しました'));
      return updated;
    }

    function renderPaperCards() {
      const paperCardsAll = paperCardsOnly(allBookmarks);
      const list = filterAndSort(paperCardsAll, paperSearchEl.value, paperSortEl.value);
      paperListStatus.style.display = list.length ? 'none' : 'block';
      paperListStatus.textContent = paperCardsAll.length
        ? '検索条件に一致するS-NEXUA 撮影名刺がありません。'
        : 'まだS-NEXUA 撮影名刺は登録されていません。';
      paperCardsEl.innerHTML = '';
      for (const b of list) {
        const card = document.createElement('div');
        const row = document.createElement('div');
        row.className = 'row';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = b.name || '（名前未設定）';
        row.appendChild(nameSpan);
        const dateSpan = document.createElement('span');
        dateSpan.textContent = b.savedAt ? new Date(b.savedAt).toLocaleDateString('ja-JP') : '';
        row.appendChild(dateSpan);
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.addEventListener('click', async () => {
          const target = b.name || '（名前未設定の名刺）';
          if (!(await appConfirm(`「${target}」を削除します。よろしいですか？`))) return;
          try {
            const code = getCode();
            const updated = await saveWithRefetch(code, (list) =>
              list.filter((x) => x.frontPhotoUrl !== b.frontPhotoUrl)
            );
            allBookmarks = updated;
            renderPaperCards();
          } catch (err) {
            await appAlert(err.message || '削除に失敗しました。もう一度お試しください。');
          }
        });
        row.appendChild(delBtn);
        card.appendChild(row);

        if (b.frontPhotoUrl || b.backPhotoUrl) {
          const photosRow = document.createElement('div');
          photosRow.className = 'card-photos-row';
          [['表', b.frontPhotoUrl], ['裏', b.backPhotoUrl]].forEach(([label, url]) => {
            if (!url) return;
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.className = 'card-photo-link';
            link.addEventListener('click', (e) => {
              e.preventDefault();
              openLightbox(url, label + '面');
            });
            const img = document.createElement('img');
            img.src = url;
            img.alt = label + '面';
            img.className = 'card-photo-thumb';
            link.appendChild(img);
            photosRow.appendChild(link);
          });
          card.appendChild(photosRow);
        }

        // タグ（後から編集可能）
        renderEditableRow(card, {
          displayText: b.tags.length ? b.tags.join('・') : 'タグなし',
          isEmpty: !b.tags.length,
          editLabel: b.tags.length ? '編集' : '+ タグを追加',
          isTextarea: false,
          inputValue: b.tags.join(','),
          inputPlaceholder: '例：DIY,交流会',
          onSave: async (raw) => {
            const newTags = raw.split(',').map((t) => t.trim()).filter(Boolean);
            const code = getCode();
            const updated = await saveWithRefetch(code, (list) =>
              list.map((x) => (x.frontPhotoUrl === b.frontPhotoUrl ? { ...x, tags: newTags } : x))
            );
            allBookmarks = updated;
            renderPaperCards();
          },
          onSaveError: async (err) => {
            await appAlert(err.message || 'タグの保存に失敗しました。もう一度お試しください。');
          },
        });

        // ひとことメモ（後から編集可能）
        renderEditableRow(card, {
          displayText: b.memo || 'メモなし',
          isEmpty: !b.memo,
          editLabel: b.memo ? '編集' : '+ メモを追加',
          isTextarea: true,
          inputValue: b.memo || '',
          onSave: async (raw) => {
            const newMemo = raw.trim();
            const code = getCode();
            const updated = await saveWithRefetch(code, (list) =>
              list.map((x) => (x.frontPhotoUrl === b.frontPhotoUrl ? { ...x, memo: newMemo } : x))
            );
            allBookmarks = updated;
            renderPaperCards();
          },
          onSaveError: async (err) => {
            await appAlert(err.message || 'メモの保存に失敗しました。もう一度お試しください。');
          },
        });

        paperCardsEl.appendChild(card);
      }
    }

    async function loadPaperCards() {
      const code = getCode();
      paperListStatus.style.display = 'block';
      paperListStatus.textContent = '読み込み中...';
      try {
        const res = await getBookmarks(code);
        if (!res.success) throw new Error(describeApiError(res, '一覧の取得に失敗しました'));
        allBookmarks = res.bookmarks;
        renderPaperCards();
      } catch (err) {
        paperListStatus.textContent = '読み込みに失敗しました。もう一度開き直してください。';
      }
    }

    function resetPaperCardForm() {
      paperCardNameInput.value = '';
      paperCardTagsInput.value = '';
      paperCardMemoInput.value = '';
      paperCardFrontInput.value = '';
      paperCardBackInput.value = '';
      paperCardFrontBlob = null;
      paperCardBackBlob = null;
      paperCardFrontPreview.style.display = 'none';
      paperCardFrontPreview.removeAttribute('src');
      paperCardBackPreview.style.display = 'none';
      paperCardBackPreview.removeAttribute('src');
      paperCardFrontBtn.textContent = '📷 表面を撮影・選択（必須）';
      paperCardBackBtn.textContent = '📷 裏面を撮影・選択（任意）';
      paperCardSaveBtn.disabled = false;
      paperCardSaveBtn.textContent = '登録する';
      googleLinkBtn.disabled = false;
      googleLinkBtn.textContent = 'Googleと連携する';
      // 同じセッション内で既にGoogle連携済み（有効なトークンをキャッシュ済み）なら
      // 2枚目以降の登録で毎回連携し直しにならないよう、案内をスキップして
      // 直接フォームを開く
      if (window.__accessToken) {
        googleLinkNotice.style.display = 'none';
        paperCardForm.style.display = 'block';
      } else {
        googleLinkNotice.style.display = 'block';
        paperCardForm.style.display = 'none';
      }
    }

    paperCardOpenBtn.addEventListener('click', () => {
      resetPaperCardForm();
      paperCardModal.style.display = 'flex';
    });
    paperCardCancelBeforeLink.addEventListener('click', () => {
      paperCardModal.style.display = 'none';
    });
    paperCardCancelBtn.addEventListener('click', () => {
      paperCardModal.style.display = 'none';
    });
    paperCardFrontBtn.addEventListener('click', () => paperCardFrontInput.click());
    paperCardBackBtn.addEventListener('click', () => paperCardBackInput.click());

    paperCardFrontInput.addEventListener('change', async () => {
      const file = paperCardFrontInput.files[0];
      if (!file) return;
      try {
        paperCardFrontBlob = await resizeImageFile(file);
        paperCardFrontPreview.src = URL.createObjectURL(paperCardFrontBlob);
        paperCardFrontPreview.style.display = 'block';
        paperCardFrontBtn.textContent = '📷 表面を撮り直す';
      } catch (err) {
        await appAlert(err.message || '写真の読み込みに失敗しました。');
      }
    });
    paperCardBackInput.addEventListener('change', async () => {
      const file = paperCardBackInput.files[0];
      if (!file) return;
      try {
        paperCardBackBlob = await resizeImageFile(file);
        paperCardBackPreview.src = URL.createObjectURL(paperCardBackBlob);
        paperCardBackPreview.style.display = 'block';
        paperCardBackBtn.textContent = '📷 裏面を撮り直す';
      } catch (err) {
        await appAlert(err.message || '写真の読み込みに失敗しました。');
      }
    });

    paperCardSaveBtn.addEventListener('click', async () => {
      if (!paperCardFrontBlob) {
        await appAlert('表面の写真は必須です。撮影・選択してください。');
        return;
      }
      const code = getCode();
      paperCardSaveBtn.disabled = true;
      paperCardSaveBtn.textContent = '登録中...';
      try {
        const token = window.__accessToken;
        const frontPhotoUrl = await uploadPhoto(token, paperCardFrontBlob, 'paper-card-front.jpg');
        const backPhotoUrl = paperCardBackBlob ? await uploadPhoto(token, paperCardBackBlob, 'paper-card-back.jpg') : '';
        const tags = paperCardTagsInput.value.split(',').map((t) => t.trim()).filter(Boolean);
        const entry = {
          url: '',
          name: paperCardNameInput.value.trim(),
          tags,
          memo: paperCardMemoInput.value.trim(),
          savedAt: new Date().toISOString(),
          frontPhotoUrl,
          backPhotoUrl,
        };

        const remote = await getBookmarks(code);
        if (!remote.success) throw new Error(describeApiError(remote, '一覧の取得に失敗しました'));
        const updated = [...remote.bookmarks, entry];
        const saveRes = await saveBookmarks(code, updated);
        if (!saveRes.success) throw new Error(describeApiError(saveRes, '保存に失敗しました'));

        allBookmarks = updated;
        renderPaperCards();
        paperCardModal.style.display = 'none';
      } catch (err) {
        paperCardSaveBtn.disabled = false;
        paperCardSaveBtn.textContent = '登録する';
        await appAlert(err.message || 'S-NEXUA 撮影名刺の登録に失敗しました。もう一度お試しください。');
      }
    });

    googleLinkBtn.addEventListener('click', () => {
      googleLinkBtn.disabled = true;
      googleLinkBtn.textContent = '連携しています...';
      requestLogin();
    });

    function onGoogleToken(token) {
      window.__accessToken = token;
      googleLinkNotice.style.display = 'none';
      paperCardForm.style.display = 'block';
    }

    function onGoogleError() {
      googleLinkBtn.disabled = false;
      googleLinkBtn.textContent = 'Googleと連携する';
    }

    paperSearchEl.addEventListener('input', renderPaperCards);
    paperSortEl.addEventListener('change', renderPaperCards);

    // ページを開いた時点ではGoogleとは一切通信しない。連携ボタンを押した
    // 時だけrequestLogin()を呼ぶ（自動サイレントログインは行わない。
    // index.htmlの同期処理と同じ方針で、勝手にアカウント選択画面が出る
    // 問題を避けるため）。一覧の取得・表示・削除はGoogle連携不要
    window.addEventListener('load', () => {
      const code = getCode();
      if (!code) {
        noCodeNotice.style.display = 'block';
        return;
      }
      initGoogleAuth(GOOGLE_CLIENT_ID, onGoogleToken, onGoogleError);
      paperListUi.style.display = 'block';
      loadPaperCards();
    });
  </script>
</body>
</html>
